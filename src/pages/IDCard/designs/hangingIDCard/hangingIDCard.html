
<div class="id-card-container">
    <div class="page">
 
        <!-- Header -->
        <div class="card-header">
            <div class="school-logo-wrap">
                <img src="" id="school-logo" alt="School Logo" crossorigin="anonymous" />
            </div>
            <div class="school-head">
                <div id="school-name">School Name</div>
                <p id="school-UDISE">UDISE: <span>123456</span></p>
            </div>
            <div class="session-pill">Session <span id="session-year">2025-26</span></div>
        </div>
 
        <!-- Body -->
        <div class="card-body">
 
            <!-- Photo and QR, same size, side by side -->
            <div class="photo-row">
                <div class="photo-frame">
                    <img src="" id="student-image" alt="Student Photo" crossorigin="anonymous" />
                </div>
                <div class="qr-frame" id="student-qr" style="display: none;">
                    <div id="student-qr-code"></div>
                </div>
            </div>
 
            <!-- Name -->
            <div class="identity">
                <h1 id="student-name">Student Name</h1>
                <p id="student-father">Father's Name</p>
            </div>
 
            <!-- Details -->
            <table class="details">
                <tbody>
                    <tr>
                        <td class="label">Class</td>
                        <td class="colon">:</td>
                        <td class="value" id="student-class-roll">Class - Roll</td>
                    </tr>
                    <tr>
                        <td class="label">Date of Birth</td>
                        <td class="colon">:</td>
                        <td class="value" id="student-DOB">DOB</td>
                    </tr>
                    <tr>
                        <td class="label">Phone</td>
                        <td class="colon">:</td>
                        <td class="value" id="student-phone">Phone</td>
                    </tr>
                    <tr>
                        <td class="label">Address</td>
                        <td class="colon">:</td>
                        <td class="value address" id="student-address">Address</td>
                    </tr>
                </tbody>
            </table>
 
            <!-- Signatures -->
            <div class="signatures">
                <div class="sign-cell">
                    <div class="sign-box">
                        <img src="" id="teacher-sign" alt="" />
                        <span id="teacher-name" data-field="teacher-name" class="signature-name" style="color: red;"></span>
                    </div>
                    <p class="sign-label" id="teacher-sign-label">Teacher's Sign</p>
                </div>
                <div class="sign-cell">
                    <div class="sign-box">
                        <img src="" id="principal-sign" alt="" />
                        <span id="principal-name" data-field="principal-name" class="signature-name" style="color: green;"></span>
                    </div>
                    <p class="sign-label" id="principal-sign-label">Principal's Sign</p>
                </div>
            </div>
        </div>
 
        <!-- Footer -->
        <div class="card-footer">
            <div id="school-address">School Address</div>
            <div id="school-phone">School Phone</div>
        </div>
 
    </div>
</div>
